name: 기능 구현
description: 새로운 기능 작업을 등록합니다.
title: "[Feat] "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
      description: 구현할 기능과 사용자 가치를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      value: |
        - [ ] UI 구현
        - [ ] 상태 및 비즈니스 로직 구현
        - [ ] 테스트
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 기능명세, 디자인, API 문서 링크를 적어주세요.

